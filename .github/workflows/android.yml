name: Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compose IME / Android 36
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      XYU_VERSION_CODE: ${{ github.run_number }}
      XYU_VERSION_NAME: 0.3.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache@v4
        id: native-cache
        with:
          path: .native/install
          key: rime-1.17.0-ndk28-${{ hashFiles('scripts/build-rime.sh') }}
      - name: Install native toolchain
        run: |
          sdkmanager 'ndk;28.2.13676358' 'cmake;3.22.1'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmake/3.22.1/bin" >> "$GITHUB_PATH"
      - name: Build pinned librime for both ABIs
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-rime.sh
      - name: Cache completed native dependencies
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .native/install
          key: rime-1.17.0-ndk28-${{ hashFiles('scripts/build-rime.sh') }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile, unit tests and Android lint
        run: ./gradlew --no-daemon --stacktrace :rime-engine:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify real IME window on Android 36
        id: emulator_ime_smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew --no-daemon --stacktrace :rime-engine:connectedDebugAndroidTest
            bash scripts/emulator-smoke.sh
      - name: Summarize emulator check
        if: always()
        run: |
          printf 'Android 36 IME smoke test: %s\n' '${{ steps.emulator_ime_smoke.outcome }}' >> "$GITHUB_STEP_SUMMARY"
      - name: Restore fixed signing identity
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_DATA: ${{ secrets.XYU_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_DATA" || { echo 'Fixed signing key is missing from repository Secrets'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_DATA" | base64 --decode > "$RUNNER_TEMP/xyu-ime.p12"
      - name: Build signed installable APK
        if: github.event_name != 'pull_request'
        env:
          XYU_KEYSTORE_PATH: ${{ runner.temp }}/xyu-ime.p12
          XYU_KEYSTORE_PASSWORD: ${{ secrets.XYU_KEYSTORE_PASSWORD }}
          XYU_KEY_ALIAS: ${{ secrets.XYU_KEY_ALIAS }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease
      - name: Prepare review package
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/xyu-ime-${XYU_VERSION_NAME}.apk"
          cp docs/acceptance-phase3.md dist/READ-ME.md
          python3 scripts/verify-apk.py dist/*.apk | tee dist/native-validation.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 dist/*.apk > dist/zipalign.txt
          cp emulator-review/*.png dist/ 2>/dev/null || true
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/*.apk
          printf 'Commit: %s\nVersion: %s (%s)\nBuilt UTC: %s\n' "$GITHUB_SHA" "$XYU_VERSION_NAME" "$XYU_VERSION_CODE" "$(date -u +%FT%TZ)" > dist/BUILD.txt
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: xyu-ime-${{ env.XYU_VERSION_NAME }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
      - name: Upload validation reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-checks-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
            rime-engine/build/reports/
            rime-engine/build/outputs/androidTest-results/
            emulator-review/
          if-no-files-found: ignore
      - name: Clear temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/xyu-ime.p12"
