schema:
  schema_id: xyu_pinyin
  name: 絮雨拼音
  version: '2'
switches:
  - name: ascii_mode
    reset: 0
    states: [中文, English]
engine:
  processors: [ascii_composer, speller, selector, navigator, express_editor]
  segmentors: [ascii_segmentor, abc_segmentor, fallback_segmentor]
  translators: [script_translator]
menu:
  page_size: 9
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
  algebra:
    - erase/^hm$/
    - erase/^m$/
    - erase/^n$/
    - erase/^ng$/
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    - derive/^([nl])ue$/$1ve/
    - derive/^([jqxy])u/$1v/
translator:
  dictionary: pinyin_simp
  enable_user_dict: true
  # Emit the candidate's dictionary syllables for full input, abbreviations and sentences.
  spelling_hints: 256
  always_show_comments: true
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([jqxy])v/$1u/
